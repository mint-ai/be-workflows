name: Build, and upload application static

on:
  workflow_call:
    inputs:
      registry:
        required: true
        type: string
      repository:
        required: true
        type: string
      aws-domain:
        required: true
        type: string
      aws-domain-owner:
        required: true
        type: string
      aws-role:
        required: true
        type: string
      aws-region:
        required: true
        type: string
      dockerfile_path:
        type: string
        required: false
        default: "Dockerfile"
      fail-on-distrusted-ca:
        description: Fail the build if the image trusts roots of the compromised eMudhra intermediate CAs
        type: boolean
        required: false
        default: true

permissions:
  id-token: write
  contents: read

jobs:
  build-test-upload-application-static:
    name: Build, test and upload application static new artifact

    runs-on: ubuntu-latest

    env:
      POSTGRES_DB: myn
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
      REGISTRY: ${{ inputs.registry }}
      REPOSITORY: ${{ inputs.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set IMAGE_NAME
        run: |
          GIT_SHORT_REV=$(git rev-parse HEAD | cut -c1-7)
          echo "IMAGE_NAME=$REGISTRY/$REPOSITORY:$GIT_SHORT_REV" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ inputs.aws-region }}
          role-to-assume: ${{ inputs.aws-role }}

      - name: Generate CodeArtifact password
        id: codeartifact-password-generator
        run: |
          export CODEARTIFACT_PASSWORD=$(aws codeartifact get-authorization-token --domain-owner ${{ inputs.aws-domain-owner }} --domain ${{ inputs.aws-domain }} --query 'authorizationToken' --output text)
          echo "::add-mask::$CODEARTIFACT_PASSWORD"
          echo "codeartifact_password=$CODEARTIFACT_PASSWORD" >> $GITHUB_OUTPUT

      # Rotate the layer cache weekly so cached base image / ca-certificates
      # layers cannot pin a stale trust store forever.
      - name: Set cache scope
        id: cache-scope
        run: echo "scope=buildkit-$(date -u +%G-W%V)" >> $GITHUB_OUTPUT

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile_path }}
          pull: true
          cache-from: type=gha,scope=${{ steps.cache-scope.outputs.scope }}
          cache-to: type=gha,mode=max,scope=${{ steps.cache-scope.outputs.scope }}
          tags: ${{ env.IMAGE_NAME }}
          load: true
          secrets: |
            codeartifact-password=${{ steps.codeartifact-password-generator.outputs.codeartifact_password }}

      - name: Verify image trust stores
        uses: mint-ai/be-workflows/.github/actions/verify-trust-store@main
        with:
          image: ${{ env.IMAGE_NAME }}
          fail: ${{ inputs.fail-on-distrusted-ca }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push ${{ env.IMAGE_NAME }} to Amazon ECR
        run: docker push ${{ env.IMAGE_NAME }}
